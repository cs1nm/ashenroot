name: Build Android APK

on:
  push:
    branches: [ main, arena/** ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.1"
  GODOT_SUFFIX: "stable"

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>/dev/null || true

      - name: Generate debug keystore
        run: |
          mkdir -p ~/.local/share/godot/keystores
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore ~/.local/share/godot/keystores/debug.keystore \
            -storepass android -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 2>/dev/null || true
          echo "Keystore contents:"
          ls -la ~/.local/share/godot/keystores/ || true

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/godot
            ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_SUFFIX }}-v2

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_SUFFIX}/Godot_v${GODOT_VERSION}-${GODOT_SUFFIX}_linux.x86_64.zip" -O godot.zip
          unzip -qo godot.zip -d ~/godot-bin
          chmod +x ~/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_SUFFIX}_linux.x86_64
          echo "Godot downloaded:"
          ls -la ~/godot-bin/

      - name: Download export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_SUFFIX}"
          mkdir -p "$TEMPLATE_DIR"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_SUFFIX}/Godot_v${GODOT_VERSION}-${GODOT_SUFFIX}_export_templates.tpz" -O templates.tpz
          unzip -qo templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* "$TEMPLATE_DIR/"
          echo "Templates installed:"
          ls "$TEMPLATE_DIR/" | head -20

      - name: Create version.txt for templates
        run: |
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_SUFFIX}"
          echo "${GODOT_VERSION}.${GODOT_SUFFIX}" > "$TEMPLATE_DIR/version.txt"

      - name: Import project assets
        run: |
          GODOT=~/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_SUFFIX}_linux.x86_64
          $GODOT --headless --path . --import 2>&1 || true
          sleep 3
          $GODOT --headless --path . --import 2>&1 || true

      - name: Export debug APK
        run: |
          GODOT=~/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_SUFFIX}_linux.x86_64
          mkdir -p build/android
          $GODOT --headless --path . --export-debug "Android" build/android/AshenRoots.apk 2>&1
          ls -lah build/android/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ashenroots-apk
          path: build/android/*.apk
          retention-days: 90

      - name: Create Release with APK
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Latest Build' }}
          files: build/android/*.apk
          generate_release_notes: true
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKE
